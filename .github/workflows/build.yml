name: Build APK and AAB
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Clean old android folder
        run: |
          rm -rf android
          echo "Old android folder deleted, will create fresh one"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --legacy-peer-deps
      
      - name: Build web
        run: npm run build
      
      - name: Generate fresh icons
        run: |
          npx @capacitor/assets generate --android || echo "assets gen failed"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      
      - name: Build APK and AAB
        run: |
          npx cap add android
          npx cap sync android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB-release
          path: android/app/build/outputs/bundle/release/app-release.aab
